<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thất bại | The Editorial Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        h1 {
            font-family: 'Noto Serif', serif;
        }
    </style>
</head>
<body class="bg-[#faf9f8] min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 text-center border border-gray-100">
        <div class="mb-6 flex justify-center">
            <div class="w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center shadow-inner">
                <span class="material-symbols-outlined text-rose-600" style="font-size: 48px; font-variation-settings: 'FILL' 1;">cancel</span>
            </div>
        </div>

        <h1 class="text-3xl font-bold text-rose-700 mb-4">Giao dịch thất bại</h1>
        <p class="text-stone-500 mb-8 leading-relaxed text-sm">
            Thanh toán của bạn đã bị hủy hoặc xảy ra lỗi trong quá trình xử lý từ ngân hàng. Vui lòng thử lại sau.
        </p>

        <div class="flex flex-col gap-3">
            <button onclick="window.location.href='/user_profile.html'"
                    class="w-full bg-[#003345] text-white py-4 rounded-xl font-bold text-sm tracking-widest hover:bg-[#004b63] transition-all shadow-lg active:scale-95 uppercase">
                Về trang cá nhân
            </button>
            <button onclick="window.location.href='/'"
                    class="w-full bg-transparent border-2 border-outline-variant/30 text-stone-500 py-4 rounded-xl font-bold text-sm tracking-widest hover:bg-stone-50 transition-all active:scale-95 uppercase">
                Về trang chủ
            </button>
        </div>
    </div>
</body>
</html>
