<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Xác thực người dùng | Azure Sands</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="/css/auth-messages.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

            theme: {

                    colors: {
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e9e8e7",
                        "background": "#faf9f8",
                        "surface-tint": "#2a657e",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#e9c176",
                        "on-tertiary-fixed": "#211a14",
                        "on-secondary-fixed": "#261900",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3f2",
                        "on-tertiary-fixed-variant": "#4e453d",
                        "on-primary-fixed-variant": "#044d65",
                        "tertiary": "#352d26",
                        "surface-variant": "#e3e2e1",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#eee0d5",
                        "inverse-primary": "#96ceeb",
                        "on-background": "#1a1c1c",
                        "on-surface-variant": "#40484c",
                        "tertiary-container": "#4c433b",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2f3130",
                        "tertiary-fixed-dim": "#d2c4b9",
                        "secondary": "#775a19",
                        "primary-fixed-dim": "#96ceeb",
                        "on-surface": "#1a1c1c",
                        "on-secondary-fixed-variant": "#5d4201",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eeeeed",
                        "surface": "#faf9f8",
                        "on-primary-fixed": "#001f2b",
                        "surface-dim": "#dadad9",
                        "secondary-fixed": "#ffdea5",
                        "primary-container": "#004b63",
                        "on-primary-container": "#83bad6",
                        "surface-container-highest": "#e3e2e1",
                        "primary": "#003345",
                        "on-secondary-container": "#785a1a",
                        "outline": "#71787d",
                        "inverse-on-surface": "#f1f0f0",
                        "secondary-container": "#fed488",
                        "error-container": "#ffdad6",
                        "surface-bright": "#faf9f8",
                        "on-tertiary-container": "#bdb0a5",
                        "primary-fixed": "#bfe8ff",

                    borderRadius: {

    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif', serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-nav {
            background: rgba(250, 249, 248, 0.8);
            backdrop-filter: blur(24px);
        }
        /* Style cho OTP input */
        .otp-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col">
    <nav class="fixed top-0 w-full z-50 glass-nav transition-colors duration-300">
        <div class="flex justify-between items-center px-12 py-6 mx-auto">
            <div class="flex items-center gap-12">
                <a class="text-2xl font-headline italic text-primary tracking-tight" href="/">The Editorial Concierge</a>
                <div class="hidden md:flex items-center gap-8 font-headline text-lg tracking-tight">
                    <a class="text-primary/70 hover:text-secondary transition-all duration-300" href="/">Trang chủ</a>
                    <a class="text-primary/70 hover:text-secondary transition-all duration-300" href="/room.html">Phòng</a>
                    <a class="text-primary/70 hover:text-secondary transition-all duration-300" href="/service.html">Dịch vụ</a>
                    <a class="text-primary/70 hover:text-secondary transition-all duration-300" href="/booking.html">Đặt ngay</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-24 flex items-stretch justify-center relative overflow-hidden">
        <div class="absolute inset-0 z-0 flex flex-row">
            <div class="hidden lg:block w-7/12 h-screen sticky top-0 relative">
                <img alt="Luxury hotel interior" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuByW9O43Acvj9mZy6VydRInWQCuy3o0BBfBQHxM9YYyM_ABvjgnvjy7R6Qnbn2fWjx78lW8KG6u9vT8yh1scsm_DYC2WNpCJLiOVTkJHpp8UuSlsvn4OySpgsNwRlgQE07dxjmdMk4FHnaiAO-vnMTONtiP-_JcrnCs6UA0AZypItbEjhDSUDTFwSpBsvgUHRLuPI49D1eN-SDffXPp0hSPfb9jyVEC736NYoeP7RBhJ1m5rfOWU1pDKPvM1nhvuABOCZokwliPtdym" />
                <div class="absolute inset-0 bg-gradient-to-r from-transparent to-background"></div>
            </div>
            <div class="w-full lg:w-5/12 bg-background"></div>
        </div>

        <div class="relative z-10 w-full max-w-xl px-6 py-12 lg:ml-auto lg:mr-24 flex items-center">
            <div class="bg-surface-container-lowest/90 glass-effect p-10 lg:p-14 rounded-xl shadow-2xl shadow-stone-200/40 border border-outline-variant/10 w-full">

                <div id="authHeader" class="mb-10 text-center lg:text-left">
                    <h1 class="text-4xl lg:text-5xl font-serif italic tracking-tight text-primary mb-3">Tham gia hành trình</h1>
                    <p class="text-stone-500 font-body text-sm tracking-wide uppercase">Kiến tạo những kỷ niệm vô giá</p>
                </div>

                <div id="forgotHeader" class="mb-10 text-center lg:text-left hidden">
                    <h1 class="text-4xl lg:text-5xl font-serif italic tracking-tight text-primary mb-3">Khôi phục mật khẩu</h1>
                    <p class="text-stone-500 font-body text-sm tracking-wide uppercase">Nhập email để nhận mã OTP an toàn</p>
                </div>

                <div id="authTabs" class="flex space-x-8 mb-10 border-b border-surface-container-high">
                    <a href="#signin" id="signinTab" class="pb-4 text-primary font-bold border-b-2 border-secondary transition-all block cursor-pointer">
                        Đăng nhập
                    </a>
                    <a href="#signup" id="signupTab" class="pb-4 text-stone-400 font-medium hover:text-primary transition-all block cursor-pointer border-b-2 border-transparent">
                        Đăng ký
                    </a>
                </div>

                <form id="signinForm" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Email đăng nhập</label>
                        <input name="email" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Nhập email của bạn" type="email" />
                    </div>
                    <div>
                        <div class="mb-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Mật khẩu</label>
                        </div>
                        <input name="password" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Nhập mật khẩu" type="password" />
                        <div class="text-right mt-3">
                            <a class="text-xs font-bold text-secondary hover:text-primary transition-colors underline-offset-4" href="#forgot">Quên mật khẩu?</a>
                        </div>
                    </div>
                    <div class="auth-messages" id="signinMessages" style="display: none;"></div>

                    <div class="space-y-3">
                        <button type="submit" class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity tracking-wider uppercase text-sm">
                            Đăng nhập vào hệ thống
                        </button>
                    </div>
                </form>

                <form id="signupForm" class="space-y-6 hidden">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Email đăng nhập</label>
                        <input name="email" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Sử dụng email làm tên đăng nhập" type="email" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Mật khẩu</label>
                        <input name="password" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Mật khẩu mới" type="password" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Nhập lại mật khẩu</label>
                        <input name="confirmPassword" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Xác nhận mật khẩu" type="password" />
                    </div>
                    <div class="auth-messages" id="signupMessages" style="display: none;"></div>
                    <div class="flex items-center space-x-3">
                        <input class="w-5 h-5 rounded border-stone-300 text-primary focus:ring-primary-container cursor-pointer" type="checkbox" required />
                        <label class="text-sm text-on-surface-variant font-medium">
                            Tôi đồng ý với các
                            <a href="/policy" target="_blank" class="text-secondary hover:underline font-bold">điều khoản và chính sách</a>
                        </label>
                    </div>

                    <div class="space-y-3">
                        <button type="submit" class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity tracking-wider uppercase text-sm">
                            Đăng ký tài khoản mới
                        </button>
                    </div>
                </form>

                <form id="forgotForm" class="space-y-6 hidden">

                    <div id="forgotStep1" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Email đăng ký tài khoản</label>
                            <input id="forgotEmailInput" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="VD: mail@example.com" type="email" />
                        </div>
                        <button type="button" id="btnSendOtp" onclick="handleSendOtp()" class="w-full py-4 bg-surface-container-highest text-primary font-bold rounded-lg hover:bg-outline-variant/30 transition-colors tracking-wider uppercase text-sm">
                            Gửi mã xác nhận OTP
                        </button>
                    </div>

                    <div id="forgotStep2" class="hidden space-y-5">
                        <div class="bg-surface-container-low p-4 rounded-lg flex items-center justify-between">
                            <span class="text-sm font-medium text-on-surface-variant">Đã gửi mã đến: <b id="displaySentEmail" class="text-primary"></b></span>
                            <button type="button" onclick="resetForgotForm()" class="text-xs text-secondary font-bold hover:underline">Đổi Email</button>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2 text-center">Nhập mã OTP 6 số</label>
                            <input id="forgotOtpInput" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400 otp-input" placeholder="••••••" type="text" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">Thiết lập mật khẩu mới</label>
                            <input id="forgotNewPasswordInput" class="w-full px-5 py-4 bg-surface-container-low rounded-lg focus:bg-surface-container-highest transition-all outline-none text-primary border-none placeholder-stone-400" placeholder="Nhập mật khẩu mới" type="password" />
                        </div>

                        <button type="submit" class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-lg shadow-lg hover:opacity-90 transition-opacity tracking-wider uppercase text-sm">
                            Xác nhận đổi mật khẩu
                        </button>
                    </div>

                    <div class="auth-messages" id="forgotMessages" style="display: none;"></div>

                    <div class="pt-6 border-t border-surface-container text-center">
                        <a href="#signin" class="text-sm font-bold text-stone-500 hover:text-primary transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại đăng nhập
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>

    <script>
        const signinTab = document.getElementById('signinTab');
        const signupTab = document.getElementById('signupTab');
        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');
        const forgotForm = document.getElementById('forgotForm');
        const authTabs = document.getElementById('authTabs');
        const authHeader = document.getElementById('authHeader');
        const forgotHeader = document.getElementById('forgotHeader');

        const activeTabClasses = ['text-primary', 'font-bold', 'border-secondary'];
        const inactiveTabClasses = ['text-stone-400', 'font-medium', 'border-transparent', 'hover:text-primary'];

        function handleHashChange() {
            const hash = window.location.hash;

            // Ẩn tất cả form
            signinForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            forgotForm.classList.add('hidden');

            if (hash === '#forgot') {
                forgotForm.classList.remove('hidden');
                authTabs.classList.add('hidden'); // Ẩn tab Đăng nhập/Đăng ký
                authHeader.classList.add('hidden'); // Ẩn tiêu đề "Tham gia hành trình"
                forgotHeader.classList.remove('hidden'); // Hiện tiêu đề "Khôi phục mật khẩu"
            } else {
                authTabs.classList.remove('hidden');
                authHeader.classList.remove('hidden');
                forgotHeader.classList.add('hidden');

                if (hash === '#signup') {
                    signupForm.classList.remove('hidden');
                    signupTab.classList.remove(...inactiveTabClasses);
                    signupTab.classList.add(...activeTabClasses);
                    signinTab.classList.remove(...activeTabClasses);
                    signinTab.classList.add(...inactiveTabClasses);
                } else {
                    // Mặc định là signin
                    signinForm.classList.remove('hidden');
                    signinTab.classList.remove(...inactiveTabClasses);
                    signinTab.classList.add(...activeTabClasses);
                    signupTab.classList.remove(...activeTabClasses);
                    signupTab.classList.add(...inactiveTabClasses);
                }
            }
        }

        window.addEventListener('hashchange', handleHashChange);
        if (!window.location.hash) window.location.hash = '#signin';
        handleHashChange();

        // Xử lý gửi OTP
        async function handleSendOtp() {
            const emailInput = document.getElementById('forgotEmailInput').value.trim();
            const btn = document.getElementById('btnSendOtp');

            if (!emailInput) {
                showAuthMessage('forgotMessages', 'Vui lòng nhập Email hợp lệ.', 'error');
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = "Đang gửi OTP...";
            btn.disabled = true;

            try {
                //Tích hợp API thực tế tại đây:
                const response = await fetch('/api/auth/forgot-password/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: emailInput })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Không thể gửi mã. Vui lòng thử lại.');

                // Giả lập delay mạng
                await new Promise(r => setTimeout(r, 1500));

                showAuthMessage('forgotMessages', 'Mã OTP đã được gửi đến email của bạn!', 'success');

                // Chuyển UI sang bước nhập OTP
                document.getElementById('displaySentEmail').innerText = emailInput;
                document.getElementById('forgotStep1').classList.add('hidden');
                document.getElementById('forgotStep2').classList.remove('hidden');

            } catch (error) {
                showAuthMessage('forgotMessages', error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Reset lại form quên mật khẩu về bước 1
        function resetForgotForm() {
            document.getElementById('forgotStep2').classList.add('hidden');
            document.getElementById('forgotStep1').classList.remove('hidden');
            document.getElementById('forgotOtpInput').value = '';
            document.getElementById('forgotNewPasswordInput').value = '';
            document.getElementById('forgotMessages').style.display = 'none';
        }

        // Xử lý Submit Form chung (Signin, Signup, Forgot OTP)
        document.addEventListener('submit', async function (event) {
            const form = event.target;
            event.preventDefault();

            // ================== ĐĂNG NHẬP ==================
            if (form.id === 'signinForm') {
                const email = form.querySelector('input[name="email"]').value.trim();
                const password = form.querySelector('input[name="password"]').value.trim();
                const errors = [];

                if (!email) errors.push('Vui lòng nhập email đăng nhập.');
                if (!password) errors.push('Vui lòng nhập mật khẩu.');

                if (errors.length > 0) {
                    showAuthMessage('signinMessages', errors[0], 'error');
                    return;
                }

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ Username: email, Password: password })
                    });
                    const data = await response.json();
                    if (!response.ok || data.success === false) {
                        throw new Error(data.error || data.message || 'Đăng nhập thất bại');
                    }
                    showAuthMessage('signinMessages', 'Đăng nhập thành công!', 'success');
                    localStorage.setItem('userToken', data.accessToken);
                    localStorage.setItem('demo_auth_user', data.fullName || email);
                    setTimeout(() => window.location.href = '/', 500);
                } catch (error) {
                    showAuthMessage('signinMessages', error.message, 'error');
                }
            }

            // ================== ĐĂNG KÝ ==================
            if (form.id === 'signupForm') {
                const email = form.querySelector('input[name="email"]').value.trim();
                const password = form.querySelector('input[name="password"]').value.trim();
                const confirmPassword = form.querySelector('input[name="confirmPassword"]').value.trim();
                const errors = [];

                if (!email) errors.push('Vui lòng nhập email đăng ký.');
                if (!password) errors.push('Vui lòng nhập mật khẩu.');
                if (password !== confirmPassword) errors.push('Mật khẩu xác nhận không khớp.');

                if (errors.length > 0) {
                    showAuthMessage('signupMessages', errors[0], 'error');
                    return;
                }

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ Username: email, Password: password })
                    });
                    const data = await response.json();
                    if (!response.ok || data.success === false) {
                        throw new Error(data.error || data.message || 'Đăng ký thất bại');
                    }
                    showAuthMessage('signupMessages', 'Đăng ký thành công! Hãy đăng nhập ngay.', 'success');
                    setTimeout(() => window.location.hash = '#signin', 1500);
                } catch (error) {
                    showAuthMessage('signupMessages', error.message, 'error');
                }
            }

            // ================== XÁC NHẬN OTP ĐỔI MẬT KHẨU ==================
            if (form.id === 'forgotForm') {
                const email = document.getElementById('forgotEmailInput').value.trim();
                const otp = document.getElementById('forgotOtpInput').value.trim();
                const newPassword = document.getElementById('forgotNewPasswordInput').value.trim();

                if (otp.length < 6) {
                    showAuthMessage('forgotMessages', 'Mã OTP phải gồm 6 chữ số.', 'error');
                    return;
                }
                if (!newPassword) {
                    showAuthMessage('forgotMessages', 'Vui lòng nhập mật khẩu mới.', 'error');
                    return;
                }

                try {
                    //Tích hợp API xác nhận OTP thực tế tại đây:
                    const response = await fetch('/api/auth/forgot-password/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ Email: email, Otp: otp, NewPassword: newPassword })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'Xác nhận thất bại');

                    // Giả lập network delay
                    await new Promise(r => setTimeout(r, 1000));

                    showAuthMessage('forgotMessages', 'Đổi mật khẩu thành công! Chuyển hướng...', 'success');
                    setTimeout(() => {
                        resetForgotForm();
                        window.location.hash = '#signin';
                    }, 1500);

                } catch (error) {
                    showAuthMessage('forgotMessages', error.message, 'error');
                }
            }
        });

        function showAuthMessage(containerId, messages, type = 'error') {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.style.display = 'block';

            if (Array.isArray(messages)) {
                container.innerHTML = messages.map(msg => `<div class="auth-message ${type}">${msg}</div>`).join('');
            } else {
                container.innerHTML = `<div class="auth-message ${type}">${messages}</div>`;
            }
        }
    </script>
</body>
