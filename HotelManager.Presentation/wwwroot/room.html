<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <script src="/js/auth-guard.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Danh sách phòng</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#001f2b",
                        "surface-container-highest": "#e3e2e1",
                        "primary-fixed": "#bfe8ff",
                        "tertiary-fixed": "#eee0d5",
                        "surface-variant": "#e3e2e1",
                        "secondary": "#775a19",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "outline-variant": "#c0c7cd",
                        "primary-fixed-dim": "#96ceeb",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#261900",
                        "on-tertiary-container": "#bdb0a5",
                        "tertiary-fixed-dim": "#d2c4b9",
                        "surface": "#faf9f8",
                        "inverse-on-surface": "#f1f0f0",
                        "surface-container-low": "#f4f3f2",
                        "tertiary": "#352d26",
                        "on-primary-container": "#83bad6",
                        "surface-tint": "#2a657e",
                        "surface-bright": "#faf9f8",
                        "on-secondary-fixed-variant": "#5d4201",
                        "surface-dim": "#dadad9",
                        "on-secondary-container": "#785a1a",
                        "background": "#faf9f8",
                        "inverse-primary": "#96ceeb",
                        "surface-container": "#eeeeed",
                        "secondary-container": "#fed488",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#4e453d",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2f3130",
                        "surface-container-high": "#e9e8e7",
                        "secondary-fixed": "#ffdea5",
                        "on-primary-fixed-variant": "#044d65",
                        "on-background": "#1a1c1c",
                        "tertiary-container": "#4c433b",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#003345",
                        "outline": "#9da3a8",
                        "on-surface-variant": "#40484c",
                        "secondary-fixed-dim": "#e9c176",
                        "primary-container": "#004b63",
                        "on-tertiary-fixed": "#211a14",
                        "on-surface": "#1a1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #faf9f8;
        }

        .font-noto-serif {
            font-family: 'Noto Serif', serif;
        }

        html {
            scrollbar-gutter: stable;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .glass-nav {
            background: rgba(250, 249, 248, 0.8);
            backdrop-filter: blur(24px);
        }

        .editorial-shadow {
            box-shadow: 0 32px 64px rgba(26, 28, 28, 0.06);
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body selection:bg-secondary-container selection:text-on-secondary-container">

    <div id="header-placeholder"></div>

    <div class="flex pt-20 min-h-screen">
        <aside class="h-[calc(100vh-5rem)] w-72 sticky left-0 top-20 bg-[#faf9f8] dark:bg-stone-900 border-r border-stone-200/20 flex flex-col p-8 gap-y-8 overflow-y-auto hidden lg:flex z-40">
            <div>
                <h2 class="font-noto-serif text-xl text-primary mb-1">Refine Selection</h2>
                <p class="font-manrope text-xs tracking-widest uppercase text-stone-400">Curated Filters</p>
            </div>
            <div class="space-y-6">
                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-[#004B63] font-semibold text-sm tracking-wide">
                        <span class="material-symbols-outlined text-sm" data-icon="hotel">hotel</span>
                        Phân loại
                    </label>
                    <div class="space-y-2" id="roomCategoryContainer">
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-[#004B63] font-semibold text-sm tracking-wide">
                        <span class="material-symbols-outlined text-sm" data-icon="sort">sort</span>
                        Sắp xếp
                    </label>
                    <select id="sortSelect" class="w-full bg-surface-container-low border-none rounded-lg text-sm text-stone-600 focus:ring-1 focus:ring-secondary">
                        <option value="default">Mặc định</option>
                        <option value="asc">Giá: Thấp đến Cao</option>
                        <option value="desc">Giá: Cao đến Thấp</option>
                    </select>
                </div>
            </div>
            <button id="resetAllBtn" class="mt-4 text-xs font-manrope uppercase tracking-widest text-[#775a19] underline underline-offset-8 hover:opacity-70 transition-opacity">
                Reset All
            </button>
        </aside>

        <main class="flex-1 p-8 md:p-12 bg-surface-container-low">
            <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div>
                    <h1 class="text-4xl md:text-5xl font-noto-serif text-primary mb-4 leading-tight">Phòng nghỉ cao cấp</h1>
                    <p class="max-w-xl text-on-surface-variant font-body leading-relaxed">Khám phá không gian sống được thiết kế riêng cho những hành trình thượng lưu, nơi sự tĩnh lặng gặp gỡ vẻ đẹp hoàn mỹ.</p>
                </div>
                <div class="text-xs font-manrope uppercase tracking-widest text-stone-400">
                    Hiển thị 6 trên 24 phòng
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10" id="roomContainer">
            </div>

            <div class="mt-24 flex justify-center items-center gap-6">
                <button class="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-[#003345] hover:bg-white transition-all shadow-sm">
                    <span class="material-symbols-outlined text-xl">arrow_back</span>
                </button>
                <div class="flex gap-3">
                    <a class="w-12 h-12 flex items-center justify-center rounded-full bg-[#003345] text-white font-bold text-base shadow-md" href="#">1</a>
                    <a class="w-12 h-12 flex items-center justify-center rounded-full text-stone-600 hover:bg-white hover:text-[#003345] transition-all font-bold text-base shadow-sm" href="#">2</a>
                    <a class="w-12 h-12 flex items-center justify-center rounded-full text-stone-600 hover:bg-white hover:text-[#003345] transition-all font-bold text-base shadow-sm" href="#">3</a>
                </div>
                <button class="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-[#003345] hover:bg-white transition-all shadow-sm">
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>
    <script src="/js/header.js"></script>

    <script>
        const ROOM_CATEGORY = {
            '1': 'Normal',
            '2': 'Vip',
            '3': 'Luxury'
        };

        const ROOM_STATUS = {
            'AVAILABLE': { label: 'Có sẵn', color: 'bg-emerald-100 text-emerald-800' },
            'MAINTENANCE': { label: 'Bảo trì', color: 'bg-amber-100 text-amber-900' },
            'DISABLED': { label: 'Ngừng kinh doanh', color: 'bg-rose-100 text-rose-900' },
            '1': { label: 'Có sẵn', color: 'bg-emerald-100 text-emerald-800' },
            '2': { label: 'Bảo trì', color: 'bg-amber-100 text-amber-900' },
            '3': { label: 'Ngừng kinh doanh', color: 'bg-rose-100 text-rose-900' }
        };

        function getCategoryLabel(category) {
            if (!category) return 'Chưa rõ';

            const catStr = String(category);

            // Nếu Backend trả về số (1, 2, 3), lấy tên từ từ điển ROOM_CATEGORY
            if (ROOM_CATEGORY[catStr]) {
                return ROOM_CATEGORY[catStr];
            }

            // Nếu Backend đã trả về sẵn chữ (Normal, Vip, Luxury), thì hiển thị thẳng chữ đó luôn
            return catStr;
        }

        function getStatusInfo(status) {
            if (!status) return { label: 'Không xác định', color: 'bg-gray-100 text-gray-800' };
            const key = String(status).toUpperCase();
            return ROOM_STATUS[key] || { label: 'Không xác định', color: 'bg-gray-100 text-gray-800' };
        }

        let currentPage = 1;
        const pageSize = 6;
        let currentFetchUrl = '/api/room'; // Lưu lại URL hiện tại (bao gồm cả query sort/filter)

        async function fetchRoom(url = '/api/room') {
            try {
                // QUAN TRỌNG: Kiểm tra xem url đã có dấu '?' chưa để nối tham số cho đúng
                const separator = url.includes('?') ? '&' : '?';
                const paginatedUrl = `${url}${separator}pageNumber=${currentPage}&pageSize=${pageSize}`;

                const response = await fetch(paginatedUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch room data');
                }

                const payload = await response.json();

                // Backend giờ trả về PagedResponse { data, totalRecords, totalPages }
                if (payload.data) {
                    return payload;
                } else {
                    // Fallback phòng hờ API lỗi trả về mảng cũ
                    return { data: Array.isArray(payload) ? payload : [], totalPages: 1, totalRecords: payload.length || 0 };
                }
            } catch (error) {
                console.error('Error fetching rooms:', error);
                return { data: [], totalPages: 0, totalRecords: 0 };
            }
        }

        //Tạo giao diện nút phân trang
        function renderPaginationUI(totalPages) {
            const paginationContainer = document.querySelector('.mt-24.flex.justify-center.items-center.gap-6');
            if (!paginationContainer) return;

            // Nếu chỉ có 1 trang hoặc không có data, ẩn phân trang
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = '';

            // Nút "Trang trước"
            html += `
                  <button onclick="changePage(${currentPage - 1})"
                          class="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-[#003345] hover:bg-white transition-all shadow-sm ${currentPage === 1 ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''}">
                      <span class="material-symbols-outlined text-xl">arrow_back</span>
                  </button>
                  <div class="flex gap-3">
              `;

            // Các nút số trang (1, 2, 3...)
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<button class="w-12 h-12 flex items-center justify-center rounded-full bg-[#003345] text-white font-bold text-base shadow-md">${i}</button>`;
                } else {
                    html += `<button onclick="changePage(${i})" class="w-12 h-12 flex items-center justify-center rounded-full text-stone-600 hover:bg-white hover:text-[#003345] transition-all font-bold text-base shadow-sm">${i}</button>`;
                }
            }

            // Nút "Trang tiếp"
            html += `
                  </div>
                  <button onclick="changePage(${currentPage + 1})"
                          class="w-12 h-12 flex items-center justify-center rounded-full text-stone-400 hover:text-[#003345] hover:bg-white transition-all shadow-sm ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''}">
                      <span class="material-symbols-outlined text-xl">arrow_forward</span>
                  </button>
              `;

            paginationContainer.innerHTML = html;
        }

        // Hàm kích hoạt khi ấn vào nút chuyển trang
        function changePage(newPage) {
            currentPage = newPage;
            renderRoom(currentFetchUrl); // Fetch lại với URL bộ lọc hiện tại
            // Tự động cuộn lên đầu danh sách phòng
            document.querySelector('header').scrollIntoView({ behavior: 'smooth' });
        }

        async function renderRoom(url = '/api/room') {
            currentFetchUrl = url; // Lưu lại url cho các nút bấm chuyển trang dùng
            const responseData = await fetchRoom(url);
            const rooms = responseData.data;
            const roomContainer = document.getElementById('roomContainer');

            // 1. Cập nhật dòng chữ "Hiển thị X trên Y phòng"
            const headerInfo = document.querySelector('header .text-xs.font-manrope');
            if (headerInfo) {
                headerInfo.innerText = `Hiển thị ${rooms.length} trên ${responseData.totalRecords} phòng`;
            }


            if (rooms.length === 0) {
                roomContainer.innerHTML = '<p class="text-center text-on-surface-variant w-full col-span-full">Không có phòng nào để hiển thị.</p>';
                renderPaginationUI(0); // Xóa nút phân trang
                return;
            }
            const roomHTML = rooms.map(room => {
                const categoryLabel = getCategoryLabel(room.category);
                const statusInfo = getStatusInfo(room.roomStatus);
                const priceFormatted = (room.pricePerNight || 0).toLocaleString('vi-VN');
                const avgRating = (room.averageStar || 0).toFixed(1);
                return `
                      <div class="group flex flex-col bg-surface-container-lowest rounded-xl overflow-hidden transition-all duration-500 hover:shadow-2xl hover:shadow-primary/5">
                        <div class="relative aspect-[4/3] overflow-hidden">
                          <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="${room.name}" src="${room.thumbnailUrl || 'https://lh3.googleusercontent.com/aida-public/AB6AXuDM_HHpNCLv4213HWJgRg39v-0_FisKXI5_R4C4IAelZx_N9h3zUJlWlFousXB4wrNnCrI2M_rlPtAh9UnVWA9foDfQ6txUdoa2I4ogKf2Cv1wikBe8opJc-YHJ4i53aCyDefhrKg4FT5_HacPBy8fP7NdJTyk8DSca5SMxdFWBMHAfRB81EtNw9G_uW_hVXf7cbW7Il8uv1n4yc4DC09HIARl_cQNCAk2wEfnyCKuCoazhrs9dUCJcLkOhB4gu-FAt8crXY52SG4pE'}" />
                          <div class="absolute top-4 left-4 flex gap-2">
                            <span class="px-3 py-1 bg-secondary-container text-on-secondary-container text-[10px] font-bold uppercase tracking-widest rounded-full">
                              ${categoryLabel}
                            </span>
                          </div>
                        </div>

                        <div class="p-6 flex flex-col flex-1">
                          <div class="flex justify-between items-start mb-2">
                            <h3 class="font-noto-serif text-xl text-primary">${room.name}</h3>

                            <div class="flex items-center gap-1 text-secondary">
                              <span class="material-symbols-outlined text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                              <span class="text-xs font-bold">${avgRating}</span>
                              <span class="text-xs text-stone-400">(${room.totalRatingCount || 0})</span>
                            </div>
                          </div>

                          <div class="flex gap-4 mb-6 text-stone-400">
                            <div class="flex items-center gap-1">
                              <span class="material-symbols-outlined text-lg" data-icon="person">person</span>
                              <span class="text-xs">${room.capacity || 0} khách</span>
                            </div>
                          </div>

                          <div class="mt-auto flex items-center justify-between">
                            <div>
                              <p class="text-[10px] uppercase tracking-tighter text-stone-400">Giá mỗi đêm</p>
                              <p class="text-lg font-bold text-primary">${priceFormatted} VNĐ</p>
                            </div>
                            <a href="/room_detail.html?id=${room._id || room.id}" class="inline-block px-6 py-2.5 bg-gradient-to-r from-primary to-primary-container text-white text-xs font-bold rounded-lg transition-transform active:scale-95 text-center">
                              Xem chi tiết
                            </a>
                          </div>
                        </div>
                      </div>
                    `;
            }).join('');
            roomContainer.innerHTML = roomHTML;
            // 2. Render các nút phân trang
            renderPaginationUI(responseData.totalPages);
        };

        function renderRoomCategory() {
            const container = document.getElementById('roomCategoryContainer');
            if (!container) return;

            // 1. Thêm tùy chọn "Tất cả" để reset bộ lọc
            let html = `
                      <label class="flex items-center gap-3 text-stone-500 hover:text-stone-800 transition-all cursor-pointer text-sm font-medium">
                        <input type="radio" name="roomCategory" value="all" checked
                          class="rounded-full border-stone-300 text-secondary focus:ring-secondary w-4 h-4 cursor-pointer" />
                        <span>Tất cả</span>
                      </label>
                 `;

            // 2. Render các loại phòng từ object ROOM_CATEGORY
            html += Object.keys(ROOM_CATEGORY).map(key => {
                return `
                    <label class="flex items-center gap-3 text-stone-500 hover:text-stone-800 transition-all cursor-pointer text-sm font-medium">
                      <input type="radio" name="roomCategory" value="${key}"
                        class="rounded-full border-stone-300 text-secondary focus:ring-secondary w-4 h-4 cursor-pointer" />
                      <span>${ROOM_CATEGORY[key]}</span>
                    </label>
                  `;
            }).join('');

            container.innerHTML = html;
            //Lắng nghe lọc điều kiện
            const radioButtons = container.querySelectorAll('input[name="roomCategory"]');
            radioButtons.forEach(radio => {
                radio.addEventListener('change', () => {
                    applyFilters();
                });
            });
        }

        //Hàm lọc
        function applyFilters() {
            currentPage = 1; // Reset về trang 1

            const selectedCategory = document.querySelector('input[name="roomCategory"]:checked').value;
            const selectedSort = document.getElementById('sortSelect').value;

            let url = '/api/room/search?'; // Trỏ tới API gộp mới ở Backend
            const params = [];

            if (selectedCategory !== 'all') {
                params.push(`category=${selectedCategory}`);
            }

            if (selectedSort !== 'default') {
                const isAsc = selectedSort === 'asc' ? 'true' : 'false';
                params.push(`isAscending=${isAsc}`);
            }

            if (params.length > 0) {
                url += params.join('&');
            } else {
                url = '/api/room/search';
            }

            renderRoom(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderRoomCategory();
            renderRoom();

            // SỰ KIỆN LẮNG NGHE SẮP XẾP
            const sortSelect = document.getElementById('sortSelect');
            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    applyFilters(); // Chỉ cần gọi hàm tổng hợp
                });
            }

            // NÚT RESET TẤT CẢ
            const resetAllBtn = document.getElementById('resetAllBtn');
            if (resetAllBtn) {
                resetAllBtn.addEventListener('click', () => {
                    currentPage = 1;
                    const allCategoryRadio = document.querySelector('input[name="roomCategory"][value="all"]');
                    if (allCategoryRadio) allCategoryRadio.checked = true;

                    if (sortSelect) sortSelect.value = 'default';

                    // Trả về danh sách gốc sử dụng API mới
                    renderRoom('/api/room/search');
                });
            }
        });
    </script>
</body>
</html>
